name: macOS HLS test build

on:
  push:
    branches: [macos-hls-seek]

permissions:
  contents: read

jobs:
  arm64:
    if: github.repository == 'hackerslash/NuvioDesktop'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Stage updated playback runtime
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install mpv
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
          mpv --version
          mpv --version | grep -F 'mpv v0.42.'
          python3 scripts/macos/stage-homebrew-mpv.py "$RUNNER_TEMP/libmpv"
      - name: Test fMP4 HLS playback, seek, and resume
        run: python3 scripts/macos/check-hls-seek.py "$RUNNER_TEMP/libmpv/libmpv.2.dylib"

      - name: Build unsigned Apple Silicon DMG
        run: |
          cp scripts/macos/playback-test.properties local.properties
          ./gradlew :composeApp:packageReleaseDmg \
            -Pnuvio.macos.arch=arm64 \
            "-Pnuvio.macos.libmpv.runtimeDir=$RUNNER_TEMP/libmpv" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: Nuvio-macOS-arm64-HLS-test
          path: composeApp/build/compose/release-dmgs/*.dmg
          if-no-files-found: error
